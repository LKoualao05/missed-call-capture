[project]
name = "missed-call-capture"
version = "1.0.0"
description = "Speed-to-lead service for home-service businesses: missed calls and after-hours form fills get an instant text, an AI qualifies the lead, and the owner gets a formatted lead on their phone."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lemuel Koualao" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "twilio>=9.0",
    "anthropic>=0.40",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# FastAPI's Depends() in defaults is the documented pattern
ignore = ["B008", "E501"]
